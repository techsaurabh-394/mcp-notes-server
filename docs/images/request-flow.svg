<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 678" width="880" height="678" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Request flow: saving a note about RAG</title>
<desc id="d">Eight numbered steps from the user asking to save a note about RAG, through the model choosing add_note, the client call, zod validation, the atomic temp file and rename write, the result and the final answer.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker></defs>
<rect width="880" height="678" rx="16" fill="#0D1117"/>
<text x="440" y="38" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">Example: "Save a note about RAG"</text>
<rect x="60" y="62" width="760" height="58" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="104" cy="91" r="18" fill="#2DD4BF"/>
<text x="104" y="97" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">1</text>
<text x="140" y="88" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">You ask the assistant</text>
<text x="140" y="110" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">"Save a note about RAG."</text>
<line x1="440" y1="120" x2="440" y2="138" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="138" width="760" height="58" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="104" cy="167" r="18" fill="#2DD4BF"/>
<text x="104" y="173" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">2</text>
<text x="140" y="164" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">The model picks a tool</text>
<text x="140" y="186" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">It chooses add_note with title, content and tags.</text>
<line x1="440" y1="196" x2="440" y2="214" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="214" width="760" height="58" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="104" cy="243" r="18" fill="#2DD4BF"/>
<text x="104" y="249" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">3</text>
<text x="140" y="240" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">The client sends the call</text>
<text x="140" y="262" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">A tools/call JSON-RPC message goes to the server over stdio.</text>
<line x1="440" y1="272" x2="440" y2="290" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="290" width="760" height="58" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2"/>
<circle cx="104" cy="319" r="18" fill="#FBBF24"/>
<text x="104" y="325" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">4</text>
<text x="140" y="316" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">zod validates the input</text>
<text x="140" y="338" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">title 1-200 chars, content 1-20000 chars, up to 10 tags.</text>
<line x1="440" y1="348" x2="440" y2="366" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="60" y="366" width="760" height="58" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2"/>
<circle cx="104" cy="395" r="18" fill="#FBBF24"/>
<text x="104" y="401" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">5</text>
<text x="140" y="392" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">The store builds the note</text>
<text x="140" y="414" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">Trims title, lowercases tags, makes an 8-hex id, adds createdAt.</text>
<line x1="440" y1="424" x2="440" y2="442" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="60" y="442" width="760" height="58" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2"/>
<circle cx="104" cy="471" r="18" fill="#FBBF24"/>
<text x="104" y="477" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">6</text>
<text x="140" y="468" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">It writes safely</text>
<text x="140" y="490" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">Writes notes.json.&lt;pid&gt;.tmp, then renames it over notes.json.</text>
<line x1="440" y1="500" x2="440" y2="518" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="60" y="518" width="760" height="58" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="104" cy="547" r="18" fill="#2DD4BF"/>
<text x="104" y="553" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">7</text>
<text x="140" y="544" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">The result comes back</text>
<text x="140" y="566" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">Saved note &lt;id&gt;: &lt;title&gt;</text>
<line x1="440" y1="576" x2="440" y2="594" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="594" width="760" height="58" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<circle cx="104" cy="623" r="18" fill="#2DD4BF"/>
<text x="104" y="629" font-size="18" fill="#0D1117" font-weight="700" text-anchor="middle">8</text>
<text x="140" y="620" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">The model answers you</text>
<text x="140" y="642" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="start">"Done, I saved it."</text>
</svg>
