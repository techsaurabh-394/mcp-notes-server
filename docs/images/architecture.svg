<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Architecture of mcp-notes-server</title>
<desc id="d">Flow from an AI assistant through an MCP client over stdio JSON-RPC into mcp-notes-server, which exposes tools, resources and a prompt, uses store.ts and persists notes in notes.json.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker></defs>
<style>@keyframes go{0%{offset-distance:0%}100%{offset-distance:100%}}#dot{offset-path:path('M440 150 L440 640');animation:go 5s linear infinite}@media (prefers-reduced-motion:reduce){#dot{display:none}}</style>
<rect width="880" height="720" rx="16" fill="#0D1117"/>
<text x="440" y="40" font-size="22" fill="#E6EDF3" font-weight="700" text-anchor="middle">How mcp-notes-server fits together</text>
<rect x="240" y="64" width="400" height="86" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<text x="440" y="98" font-size="20" fill="#E6EDF3" font-weight="700" text-anchor="middle">AI assistant</text>
<text x="440" y="126" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle">Claude Desktop, Claude Code, or another MCP app</text>
<line x1="440" y1="150" x2="440" y2="186" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="186" width="400" height="70" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<text x="440" y="216" font-size="20" fill="#E6EDF3" font-weight="700" text-anchor="middle">MCP client</text>
<text x="440" y="240" font-size="15" fill="#9DA7B3" font-weight="400" text-anchor="middle">built into the assistant app</text>
<line x1="440" y1="256" x2="440" y2="300" stroke="#FBBF24" stroke-width="2.5" marker-start="url(#aa)" marker-end="url(#aa)"/>
<text x="460" y="284" font-size="15" fill="#FBBF24" font-weight="600" text-anchor="start">stdio: JSON-RPC messages</text>
<rect x="90" y="300" width="700" height="196" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2.5"/>
<text x="440" y="330" font-size="20" fill="#E6EDF3" font-weight="700" text-anchor="middle">mcp-notes-server  (dist/index.js)</text>
<rect x="110" y="348" width="260" height="134" rx="12" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="240.0" y="376" font-size="17" fill="#2DD4BF" font-weight="700" text-anchor="middle">6 tools</text>
<text x="240.0" y="404" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">add_note, get_note,</text>
<text x="240.0" y="428" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">list_notes, search_notes,</text>
<text x="240.0" y="452" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">update_note, delete_note</text>
<rect x="384" y="348" width="175" height="134" rx="12" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="471.5" y="376" font-size="17" fill="#2DD4BF" font-weight="700" text-anchor="middle">2 resources</text>
<text x="471.5" y="404" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">notes://all</text>
<text x="471.5" y="428" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">notes://{id}</text>
<rect x="573" y="348" width="197" height="134" rx="12" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="671.5" y="376" font-size="17" fill="#2DD4BF" font-weight="700" text-anchor="middle">1 prompt</text>
<text x="671.5" y="404" font-size="14" fill="#E6EDF3" font-weight="400" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace">review_notes</text>
<line x1="440" y1="496" x2="440" y2="540" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="240" y="540" width="400" height="56" rx="12" fill="#161B22" stroke="#2DD4BF" stroke-width="2"/>
<text x="440" y="574" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="middle">store.ts  (NoteStore)</text>
<line x1="440" y1="596" x2="440" y2="630" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="290" y="630" width="300" height="56" rx="12" fill="#161B22" stroke="#FBBF24" stroke-width="2"/>
<text x="440" y="664" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="middle">notes.json</text>
<text x="440" y="705" font-size="14" fill="#9DA7B3" font-weight="400" text-anchor="middle">default: ~/.mcp-notes/notes.json   (override with NOTES_FILE)</text>
<circle id="dot" r="7" fill="#FBBF24" cx="0" cy="0"/>
</svg>
