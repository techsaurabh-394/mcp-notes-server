<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Tool call flow: save a note, then search it</title>
  <desc id="d">Five steps: user prompt, model picks a tool, server validates, store writes atomically, result returned. Each step is highlighted in turn.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .num { fill: #1f6feb; }
    .n { font-size: 18px; font-weight: 700; fill: #fff; }
    .h { font-size: 19px; font-weight: 700; }
    .s { font-size: 15px; fill: #9ba7b4; }
    .link { stroke: #58a6ff; stroke-width: 3; stroke-dasharray: 8 6; animation: dash 1s linear infinite; }
    .head { fill: #58a6ff; }
    .glow { fill: none; stroke: #2dd4bf; stroke-width: 4; opacity: 0; animation: hl 10s ease-in-out infinite; }
    @keyframes hl { 0% { opacity: 0; } 4% { opacity: 1; } 18% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .link, .glow { animation: none; } }
  </style>
  <rect class="bg" width="1200" height="380"/>
  <text x="600" y="42" text-anchor="middle" class="h" style="font-size:22px">Save a note, then search it</text>

  <rect class="card" x="30.0" y="90" width="204" height="220" rx="12"/>
  <rect class="glow" x="30.0" y="90" width="204" height="220" rx="12" style="animation-delay:0s"/>
  <circle class="num" cx="132.0" cy="130" r="20"/><text class="n" x="132.0" y="137" text-anchor="middle">1</text>
  <text class="h" x="132.0" y="188" text-anchor="middle">User prompt</text>
  <text class="s" x="132.0" y="222" text-anchor="middle">"Save: RAG chunk</text>
  <text class="s" x="132.0" y="246" text-anchor="middle">size is 800. Then</text>
  <text class="s" x="132.0" y="270" text-anchor="middle">search chunking."</text>
  <line class="link" x1="238.0" y1="200" x2="259.5" y2="200"/><polygon class="head" points="267.5,200 258.5,194 258.5,206"/>
  <rect class="card" x="271.5" y="90" width="204" height="220" rx="12"/>
  <rect class="glow" x="271.5" y="90" width="204" height="220" rx="12" style="animation-delay:2s"/>
  <circle class="num" cx="373.5" cy="130" r="20"/><text class="n" x="373.5" y="137" text-anchor="middle">2</text>
  <text class="h" x="373.5" y="188" text-anchor="middle">Model picks tool</text>
  <text class="s" x="373.5" y="222" text-anchor="middle">add_note first,</text>
  <text class="s" x="373.5" y="246" text-anchor="middle">then search_notes</text>
  <line class="link" x1="479.5" y1="200" x2="501.0" y2="200"/><polygon class="head" points="509.0,200 500.0,194 500.0,206"/>
  <rect class="card" x="513.0" y="90" width="204" height="220" rx="12"/>
  <rect class="glow" x="513.0" y="90" width="204" height="220" rx="12" style="animation-delay:4s"/>
  <circle class="num" cx="615.0" cy="130" r="20"/><text class="n" x="615.0" y="137" text-anchor="middle">3</text>
  <text class="h" x="615.0" y="188" text-anchor="middle">Server validates</text>
  <text class="s" x="615.0" y="222" text-anchor="middle">zod schema +</text>
  <text class="s" x="615.0" y="246" text-anchor="middle">size limits</text>
  <line class="link" x1="721.0" y1="200" x2="742.5" y2="200"/><polygon class="head" points="750.5,200 741.5,194 741.5,206"/>
  <rect class="card" x="754.5" y="90" width="204" height="220" rx="12"/>
  <rect class="glow" x="754.5" y="90" width="204" height="220" rx="12" style="animation-delay:6s"/>
  <circle class="num" cx="856.5" cy="130" r="20"/><text class="n" x="856.5" y="137" text-anchor="middle">4</text>
  <text class="h" x="856.5" y="188" text-anchor="middle">Store writes</text>
  <text class="s" x="856.5" y="222" text-anchor="middle">lock, write temp</text>
  <text class="s" x="856.5" y="246" text-anchor="middle">file, rename</text>
  <line class="link" x1="962.5" y1="200" x2="984.0" y2="200"/><polygon class="head" points="992.0,200 983.0,194 983.0,206"/>
  <rect class="card" x="996.0" y="90" width="204" height="220" rx="12"/>
  <rect class="glow" x="996.0" y="90" width="204" height="220" rx="12" style="animation-delay:8s"/>
  <circle class="num" cx="1098.0" cy="130" r="20"/><text class="n" x="1098.0" y="137" text-anchor="middle">5</text>
  <text class="h" x="1098.0" y="188" text-anchor="middle">Result returned</text>
  <text class="s" x="1098.0" y="222" text-anchor="middle">"Saved note a1b2c3d4"</text>
  <text class="s" x="1098.0" y="246" text-anchor="middle">then the match</text>
  <text x="600" y="350" text-anchor="middle" class="s">Read-only calls (search, get, list, export) skip step 4: nothing is written.</text>
</svg>
